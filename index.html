<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excuse Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: white;
            font-size: 3.5rem;
            margin-bottom: 60px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            font-weight: 700;
        }

        .controls {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .language-selector {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 25px 50px;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 100px;
            display: none;
            animation: fadeIn 0.5s;
        }

        .result.show {
            display: block;
        }

        .result-text {
            font-size: 1.2rem;
            color: #333;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .controls {
                padding: 30px 20px;
            }

            button {
                font-size: 1.2rem;
                padding: 20px 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Need an excuse for today?</h1>

        <div class="controls">
            <div class="language-selector">
                <label for="language">Select Language:</label>
                <select id="language">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                </select>
            </div>

            <button id="generateBtn">Generate excuse</button>
        </div>

        <div class="result" id="result">
            <p class="result-text" id="resultText"></p>
        </div>
    </div>

    <script>

            ar: [
                "صيانة المركبة غير المتوقعة تطلبت اهتماماً فورياً.",
                "موعد طبي مجدول قبل أسابيع لا يمكن إعادة جدولته.",
                "حالة طوارئ منزلية: تم اكتشاف تسرب مياه يتطلب إصلاحاً فورياً.",
                "أفراد العائلة واجهوا مشكلة طبية تتطلب النقل إلى المنشأة.",
                "نظام النقل العام شهد انقطاعاً موثقاً في الخدمة.",
                "ظروف الطقس القاسية تجاوزت معايير القيادة الآمنة.",
                "ترتيب رعاية الطفل فشل بسبب مرض مقدم الخدمة.",
                "استلام الدواء المطلوب من الصيدلية قبل الإغلاق.",
                "مقاول إصلاح المنزل الأساسي متاح فقط في هذا الإطار الزمني المحدد.",
                "حالة طوارئ بيطرية للحيوان الأليف المنزلي تطلبت تدخلاً فورياً."
            ]
        };

        document.getElementById('generateBtn').addEventListener('click', function() {
            const language = document.getElementById('language').value;
            const excuseList = excuses[language];
            const randomExcuse = excuseList[Math.floor(Math.random() * excuseList.length)];

            const resultElement = document.getElementById('result');
            const resultText = document.getElementById('resultText');

            resultText.textContent = randomExcuse;
            resultElement.classList.remove('show');

            setTimeout(() => {
                resultElement.classList.add('show');
            }, 10);
        });
    </script>
</body>
</html>
