<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Tarot Card Reading</title>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 600;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
            font-weight: 300;
        }

        .input-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        select option {
            background: #1a1a2e;
            color: #fff;
        }

        .btn-primary {
            width: 100%;
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .cards-section {
            display: none;
            margin: 50px 0;
            animation: fadeInUp 0.6s ease;
        }

        .cards-section.show {
            display: block;
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 40px 0;
        }

        .card-wrapper {
            perspective: 1000px;
        }

        .card {
            width: 180px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .card-back::after {
            content: '★';
            font-size: 4rem;
            opacity: 0.3;
        }

        .card-front {
            background: white;
            color: #1a1a2e;
            transform: rotateY(180deg);
            padding: 20px;
            flex-direction: column;
            border: 3px solid #667eea;
        }

        .card-name {
            font-size: 1rem;
            text-align: center;
            margin-top: 10px;
            line-height: 1.3;
        }

        .card-symbol {
            font-size: 3rem;
            margin-bottom: 10px;
        }

            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-top: 40px;
            text-align: left;
            display: none;
            animation: fadeInUp 0.6s ease;
        }

        .reading-section.show {

        }

        .card-interpretation {
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            border-left: 4px solid #667eea;
        }

        .card-interpretation h3 {
            color: #667eea;
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .card-interpretation p {
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .final-reading {
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 15px;
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

            color: #f093fb;
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .final-reading p {
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.9;
            font-size: 1.1rem;
        }

        .btn-secondary {
            margin-top: 30px;
            padding: 15px 35px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;

        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .input-section {
                padding: 25px;
            }

            .card {
                width: 140px;
                height: 230px;
            }

            .cards-container {
                gap: 15px;
            }

            .reading-section {
                padding: 25px;
            }
        }
    </style>
</head>

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);

        function selectRandomCards() {
            const selected = [];
            const usedIndices = new Set();

                const index = getRandomInt(tarotCards.length);
                if (!usedIndices.has(index)) {
                    usedIndices.add(index);
                    const card = tarotCards[index];
                    const explanationIndex = getRandomInt(card.explanations.length);
                    selected.push({
                        ...card,
                        selectedExplanation: card.explanations[explanationIndex]
                    });
                }
            }

            return selected;
        }

            cardBack.className = 'card-face card-back';

            cardFront.innerHTML = `
                <div class="card-symbol">${card.symbol}</div>
                <div class="card-name">${card.name}</div>
            `;

            cardDiv.appendChild(cardBack);
            cardDiv.appendChild(cardFront);
            wrapper.appendChild(cardDiv);

            return { wrapper, cardDiv };
        }

                const cardInterp = document.createElement('div');
                cardInterp.className = 'card-interpretation';
                cardInterp.style.opacity = '0';
                cardInterp.innerHTML = `
                    <h3>${card.symbol} ${card.name}</h3>
                    <p>${card.selectedExplanation}</p>
                `;

                interpretationsDiv.appendChild(cardInterp);

                setTimeout(() => {
                    cardInterp.style.transition = 'opacity 0.6s ease';
                    cardInterp.style.opacity = '1';
                }, 50);
            }
        }

        async function showFinalReading() {
            await new Promise(resolve => setTimeout(resolve, 800));

            const finalReadingDiv = document.getElementById('finalReading');
            const randomReading = combinationReadings[getRandomInt(combinationReadings.length)];
            const trans = translations[currentLanguage];

            finalReadingDiv.innerHTML = `
                <h2>${trans.guidanceTitle}</h2>
                <p>${randomReading}</p>
            `;

            finalReadingDiv.style.opacity = '0';
            setTimeout(() => {
                finalReadingDiv.style.transition = 'opacity 0.6s ease';
                finalReadingDiv.style.opacity = '1';
            }, 50);
        }

        document.getElementById('drawCardsBtn').addEventListener('click', async function() {
            const question = document.getElementById('question').value.trim();
            currentLanguage = document.getElementById('language').value;

            if (!question) {
                alert('Please enter your question first');
                return;
            }

            const button = this;
            button.disabled = true;
            button.classList.add('loading');
            button.textContent = 'Drawing cards...';

            // Hide previous results
            document.getElementById('cardsSection').classList.remove('show');
            document.getElementById('readingSection').classList.remove('show');

            // Select random cards
            selectedCards = selectRandomCards();

            // Create card elements
            const cardsContainer = document.getElementById('cardsContainer');
            cardsContainer.innerHTML = '';
            const cardElements = [];

            selectedCards.forEach((card, index) => {
                const { wrapper, cardDiv } = createCardElement(card, index);
                cardsContainer.appendChild(wrapper);
                cardElements.push(cardDiv);
            });

            // Show cards section
            await new Promise(resolve => setTimeout(resolve, 300));
            document.getElementById('cardsSection').classList.add('show');

            // Flip cards one by one
            await flipCards(cardElements);

            // Show reading section
            document.getElementById('readingSection').classList.add('show');

            // Show interpretations
            await showInterpretations();

            // Show final reading
            await showFinalReading();

            button.disabled = false;
            button.classList.remove('loading');
            button.textContent = 'Draw Your Cards';
        });

        document.getElementById('newReadingBtn').addEventListener('click', function() {
            document.getElementById('question').value = '';
            document.getElementById('cardsSection').classList.remove('show');
            document.getElementById('readingSection').classList.remove('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
