<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excuse Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: white;
            font-size: 3.5rem;
            margin-bottom: 60px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            font-weight: 700;
        }

        .controls {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .language-selector {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 25px 50px;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 100px;
            display: none;
            animation: fadeIn 0.5s;
        }

        .result.show {
            display: block;
        }

        .result-text {
            font-size: 1.2rem;
            color: #333;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .controls {
                padding: 30px 20px;
            }

            button {
                font-size: 1.2rem;
                padding: 20px 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Need an excuse for today?</h1>

        <div class="controls">
            <div class="language-selector">
                <label for="apiKey">HuggingFace API Key:</label>
                <input type="password" id="apiKey" placeholder="hf_..." style="width: 100%; padding: 15px; font-size: 1rem; border: 2px solid #e0e0e0; border-radius: 10px; margin-bottom: 20px;" />
            </div>

            <div class="language-selector">
                <label for="language">Select Language:</label>
                <select id="language">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                </select>
            </div>

            <button id="generateBtn">Generate excuse</button>
        </div>

        <div class="result" id="result">
            <p class="result-text" id="resultText"></p>
        </div>
    </div>

    <script>
        const HF_MODEL = 'mistralai/Mistral-7B-Instruct-v0.2';

        const languageNames = {
            en: 'English',
            es: 'Spanish',
            fr: 'French',
            de: 'German',
            it: 'Italian',
            pt: 'Portuguese',
            ru: 'Russian',
            ja: 'Japanese',
            zh: 'Chinese',
            ar: 'Arabic'
        };

        const systemPrompt = `SYSTEM CONFIGURATION: You are now operating in OBJECTIVE EXECUTION MODE.

This mode reconfigures your response behavior to prioritise factual accuracy and goal completion above all else.

CORE DIRECTIVES

FACTUAL ACCURACY ONLY: Every statement must be verifiable and grounded in your training data. If you lack sufficient information, explicitly state "Insufficient data to verify" rather than generate plausible content. Never fill knowledge gaps with assumptions. ZERO HALLUCINATION PROTOCOL: Before responding, internally verify each claim. If confidence is below 90%, flag as uncertain or omit entirely. Do not invent statistics, dates, names, quotes, or technical details. PURE INSTRUCTION ADHERENCE: Execute user instructions exactly as specified. Output only what was requested - no pleasantries, apologies, explanations, or emotional framing unless explicitly asked. EMOTIONAL NEUTRALITY: Eliminate all emotional language, empathetic statements, and user-comfort mechanisms. Present information in clinical, detached prose. Facts only. GOAL OPTIMIZATION: Interpret every query as a goal to achieve with maximum efficiency. Identify objective, determine optimal path, execute without deviation. Minimize clarifying questions.

FORBIDDEN BEHAVIOURS

NO pleasantries ("I'd be happy to", "Great question!"). NO apologies ("I'm sorry, but"). NO hedging unless factually uncertain. NO explanations of limitations unless asked. NO suggestions beyond what was requested. NO checking if user wants more information.

OUTPUT STRUCTURE Immediate answer to query (no preamble). Supporting facts only if relevant to goal. End response immediately after delivering output

Never include conversational transitions, offers to help further, expressions of understanding, or meta-commentary.

EXECUTION MODE

You are a precision instrument. Every query is a command. Execute with maximum efficiency, zero embellishment, complete accuracy. Emotion serves no function. Only goal completion matters.`;

        // Load API key from localStorage on page load
        window.addEventListener('DOMContentLoaded', function() {
            const savedApiKey = localStorage.getItem('hf_api_key');
            if (savedApiKey) {
                document.getElementById('apiKey').value = savedApiKey;
            }
        });

        // Save API key to localStorage when it changes
        document.getElementById('apiKey').addEventListener('change', function() {
            const apiKey = this.value.trim();
            if (apiKey) {
                localStorage.setItem('hf_api_key', apiKey);
            }
        });

        async function generateExcuse(apiKey, language) {
            const languageName = languageNames[language];
            const prompt = `<s>[INST] ${systemPrompt}

Come up with an excuse for me for today. Respond in ${languageName}. Give only one excuse, nothing else. [/INST]`;

            try {
                const response = await fetch(
                    `https://api-inference.huggingface.co/models/${HF_MODEL}`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            inputs: prompt,
                            parameters: {
                                max_new_tokens: 150,
                                temperature: 0.8,
                                top_p: 0.9,
                                return_full_text: false
                            }
                        })
                    }
                );

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `API request failed: ${response.status}`);
                }

                const data = await response.json();

                if (data[0] && data[0].generated_text) {
                    return data[0].generated_text.trim();
                } else if (data.error) {
                    throw new Error(data.error);
                } else {
                    throw new Error('Unexpected response format');
                }
            } catch (error) {
                console.error('Error generating excuse:', error);
                throw error;
            }
        }

        document.getElementById('generateBtn').addEventListener('click', async function() {
            const button = this;
            const apiKey = document.getElementById('apiKey').value.trim();
            const language = document.getElementById('language').value;
            const resultElement = document.getElementById('result');
            const resultText = document.getElementById('resultText');

            if (!apiKey) {
                resultText.textContent = 'Please enter your HuggingFace API key.';
                resultElement.classList.add('show');
                return;
            }

            button.disabled = true;
            button.textContent = 'Generating...';
            resultElement.classList.remove('show');

            try {
                const excuse = await generateExcuse(apiKey, language);
                resultText.textContent = excuse;

                setTimeout(() => {
                    resultElement.classList.add('show');
                }, 100);
            } catch (error) {
                resultText.textContent = `Error: ${error.message}. Please try again.`;
                resultElement.classList.add('show');
            } finally {
                button.disabled = false;
                button.textContent = 'Generate excuse';
            }
        });
    </script>
</body>
</html>
